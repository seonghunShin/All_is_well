server:
  address: 127.0.0.1
  port: ${PORT:4000}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict

spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: all-is-well-backend
  datasource:
    url: ${BOOKING_DATABASE_URL:jdbc:h2:file:./data/all-is-well}
    username: sa
    password: ""
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

app:
  ignav:
    api-key: ${IGNAV_API_KEY:}
    market: ${IGNAV_MARKET:KR}
    daily-limit: ${IGNAV_DAILY_LIMIT:100}
    cache-ttl-minutes: ${IGNAV_CACHE_TTL_MINUTES:10}

booking:
  store: ${BOOKING_STORE:database}
  redis-key: ${BOOKING_REDIS_KEY:all-is-well:booking:v1}
  log-file: ${BOOKING_LOG_FILE:logs/reservation-events.jsonl}
